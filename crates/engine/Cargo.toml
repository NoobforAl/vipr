[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
audioadapter-buffers = "5.2.0"
chardetng = "1.0.0"
dirs = "7.0.0"
encoding_rs = "0.8.44"
gpu-detect = { version = "0.1.0", path = "../gpu-detect", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "rustls",
] }
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = "0.24.2"
sha2 = "0.11.1"
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-adapter-libopus = "0.3.0"
thiserror = "2.0.21"
unicode-bidi = "0.3.18"
unicode-segmentation = "1.13.3"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "engine"
harness = false
