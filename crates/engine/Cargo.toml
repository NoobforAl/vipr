[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
audioadapter = "5.0.0"
audioadapter-buffers = "5.2.0"
dirs = "7.0.0"
gpu-detect = { version = "0.1.0", path = "../gpu-detect" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = "0.24.2"
sha2 = "0.11.1"
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-adapter-libopus = "0.3.0"
thiserror = "2.0.21"
