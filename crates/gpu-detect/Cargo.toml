[package]
name = "gpu-detect"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["probe"]
# Lists non-NVIDIA graphics adapters through wgpu. Only the `detect` tool and engine-cli need it: workers use just
# the types here, and the GUI runs `detect` as a child process because wgpu in its own process can lose its device.
probe = ["dep:wgpu"]

[dependencies]
nvml-wrapper = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# keep on the same major version as iced's wgpu, so a full workspace build compiles only one copy
wgpu = { version = "27.0.1", default-features = false, optional = true, features = [
  "vulkan",
  "dx12",
  "metal",
] }

[[bin]]
name = "detect"
path = "src/main.rs"
required-features = ["probe"]
